<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Learning Platform</title>
    <!-- Use FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="auth-container">

        <!-- Login Form -->
        <div id="login-form" class="auth-card fade-in">
            <div class="auth-header">
                <div class="auth-icons">
                    <i class="fas fa-graduation-cap"></i>
                    <i class="fas fa-lightbulb"></i>
                </div>
                <h1 class="auth-title">Login</h1>
                <p class="auth-subtitle">Log in to continue</p>
            </div>

            <form>
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Password" required>
                </div>

                <button type="button" onclick="goToHome()" class="btn btn-primary">LOG IN</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account?</p>
                <button onclick="toggleAuth()" class="btn btn-link">Sign up</button>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="signup-form" class="auth-card hidden fade-in">
            <div class="auth-header">
                <!-- Can reuse icons or similar styling -->
                <h1 class="auth-title">Sign Up</h1>
                <p class="auth-subtitle">Sign up to continue</p>
            </div>

            <form>
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Password" required>
                </div>

                <button type="button" onclick="goToHome()" class="btn btn-secondary">Sign Up</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account?</p>
                <button onclick="toggleAuth()" class="btn btn-link">Log in</button>
            </div>
        </div>

    </div>

    <script src="../js/main.js"></script>
</body>

</html>
