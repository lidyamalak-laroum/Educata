<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="flow-page">

    <div class="course-container fade-in">
        <header class="nav-header">
            <a href="home.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back to Modules</a>
        </header>

        <div class="course-header">
            <div id="module-icon-container" style="font-size: 4rem; color: #ffbf00; margin-bottom: 1rem;">
                <i class="fas fa-book-open"></i>
            </div>
            <h1 id="module-title" style="color: #ffbf00; font-size: 2.5rem;">Course Content</h1>
            <p style="color: #fff;">Explore the chapters and lessons below.</p>
        </div>

        <div class="chapter-list">
            <!-- Chapter 1 -->
            <div class="chapter-item">
                <div class="chapter-title" onclick="toggleChapter(this)">
                    <span>Chapter 1: Introduction</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="lesson-list">
                    <div class="lesson-item"><i class="far fa-play-circle"></i> Lesson 1.1: Basics</div>
                    <div class="lesson-item"><i class="far fa-file-alt"></i> Lesson 1.2: History</div>
                    <div class="lesson-item"><i class="far fa-question-circle"></i> Quiz 1</div>
                </div>
            </div>

            <!-- Chapter 2 -->
            <div class="chapter-item">
                <div class="chapter-title" onclick="toggleChapter(this)">
                    <span>Chapter 2: Core Concepts</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="lesson-list">
                    <div class="lesson-item"><i class="far fa-play-circle"></i> Lesson 2.1: Rules</div>
                    <div class="lesson-item"><i class="far fa-file-alt"></i> Lesson 2.2: Examples</div>
                </div>
            </div>

            <!-- Chapter 3 -->
            <div class="chapter-item">
                <div class="chapter-title" onclick="toggleChapter(this)">
                    <span>Chapter 3: Advanced Topics</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="lesson-list">
                    <div class="lesson-item"><i class="far fa-play-circle"></i> Lesson 3.1: Deep Dive</div>
                    <div class="lesson-item"><i class="far fa-question-circle"></i> Final Exam</div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        // Simple script to set the title based on URL param
        const urlParams = new URLSearchParams(window.location.search);
        const moduleName = urlParams.get('module');
        if (moduleName) {
            // Insert space before capital letters
            const formattedName = moduleName.replace(/([A-Z])/g, ' $1').trim();
            document.getElementById('module-title').innerText = formattedName;

            // Icon logic (simple map)
            const iconContainer = document.getElementById('module-icon-container');
            if (moduleName === 'Algorithmics') iconContainer.innerHTML = '<i class="fas fa-chart-line"></i>';
            else if (moduleName === 'Mechanics') iconContainer.innerHTML = '<i class="fas fa-cog"></i>';
            else if (moduleName === 'Electricity') iconContainer.innerHTML = '<i class="fas fa-bolt"></i>';
            else if (moduleName === 'ComputerArchitecture') iconContainer.innerHTML = '<i class="fas fa-microchip"></i>';
            else if (moduleName === 'IHM') iconContainer.innerHTML = '<i class="fas fa-mouse"></i>';
            // ... add others or fallback
        }
    </script>
</body>

</html>
